<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Modo foco — Capri</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14101c; color: #f1eaf8; font: 600 18px/1.5 "Segoe UI", system-ui, sans-serif; }
    main { height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .plate { max-width: 520px; padding: 28px 32px; background: #1d1728; border: 2px solid #f5f236; box-shadow: 6px 6px 0 #4fe3ff; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%); }
    .label { font: 600 11px/1 Consolas, monospace; letter-spacing: .14em; color: #4fe3ff; margin: 0 0 14px; }
    h1 { margin: 0 0 10px; font-size: 26px; text-transform: uppercase; }
    p { margin: 0 0 18px; color: #cfc6dc; }
    a { color: #f5f236; font: 600 12px/1 Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <div class="plate">
      <p class="label">/// CAPRI.FOCO</p>
      <h1 id="title">Modo foco, choom.</h1>
      <p id="text">Esse site fica pra depois. Termina o que você tava fazendo que eu te libero.</p>
      <a id="back" href="#">Abrir mesmo assim</a>
    </div>
  </main>
  <script src="focus.js"></script>
</body>
</html>
